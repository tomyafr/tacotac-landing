<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tacotac — Publication TikTok</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0b0b; color:#F4EEE2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:28px 16px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:23px; margin:0 0 4px; color:#fff; }
  .sub { color:#8d8781; font-size:13.5px; margin:0 0 28px; }
  .card { background:#161616; border:1px solid #262626; border-radius:16px; padding:20px; margin-bottom:18px; }
  h2 { font-size:15px; margin:0 0 14px; color:#fff; text-transform:uppercase; letter-spacing:.5px; }
  .row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid #222; }
  .row:last-child { border-bottom:none; }
  .grow { flex:1; min-width:0; }
  .name { font-size:14.5px; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { font-size:12px; color:#7d7873; margin-top:2px; }
  button { background:#FF5C00; color:#fff; border:none; border-radius:10px; padding:9px 16px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.45; cursor:default; filter:none; }
  button.ghost { background:#242424; color:#F4EEE2; }
  input, select { background:#0d0d0d; border:1px solid #333; color:#F4EEE2; border-radius:10px; padding:9px 12px; font-size:13.5px; font-family:inherit; }
  input { width:190px; }
  .banner { background:#2a1c08; border:1px solid #5a3a0a; color:#f5c98a; font-size:13px; border-radius:12px; padding:12px 14px; margin-bottom:18px; line-height:1.5; }
  .empty { color:#7d7873; font-size:13.5px; }
  .status { font-size:12.5px; margin-left:2px; }
  .ok { color:#5fd08a; } .err { color:#ff7a6b; } .pending { color:#f5c98a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Publication TikTok</h1>
  <p class="sub">Console interne — connecte tes comptes TikTok et publie les vidéos produites par le pipeline.</p>

  <div id="banner" class="banner" hidden></div>

  <div class="card">
    <h2>Comptes connectés</h2>
    <div id="accounts"><p class="empty">Chargement…</p></div>
    <div class="row" style="border-top:1px solid #222; margin-top:6px;">
      <input id="label" placeholder="nom du compte" autocomplete="off">
      <button id="connect">Connecter un compte TikTok</button>
    </div>
  </div>

  <div class="card">
    <h2>Vidéos à publier</h2>
    <div id="videos"><p class="empty">Chargement…</p></div>
  </div>
</div>

<script>
let data = { accounts: [], videos: [] };

const fmtSize = (b) => (b / 1048576).toFixed(1) + ' Mo';
const fmtExp = (ts) => {
  const mins = Math.round((ts - Date.now()) / 60000);
  return mins > 0 ? `token valide ${mins} min` : 'token expiré (rafraîchi au besoin)';
};

async function load() {
  const r = await fetch('/admin/tiktok/data');
  data = await r.json();

  const banner = document.getElementById('banner');
  if (data.privacy === 'SELF_ONLY') {
    banner.hidden = false;
    banner.textContent = "L'app TikTok n'est pas encore auditée : les publications partent en privé (SELF_ONLY) et les comptes doivent être en mode privé. Une fois l'audit validé, passe TIKTOK_PRIVACY à PUBLIC_TO_EVERYONE.";
  }

  const accEl = document.getElementById('accounts');
  accEl.innerHTML = data.accounts.length ? '' : '<p class="empty">Aucun compte connecté pour l\'instant.</p>';
  for (const a of data.accounts) {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `<div class="grow"><div class="name">${a.account}</div>
      <div class="meta">${fmtExp(a.expires_at)} · ${a.scope || ''}</div></div>`;
    accEl.appendChild(div);
  }

  const vidEl = document.getElementById('videos');
  if (!data.videoDirConfigured) {
    vidEl.innerHTML = '<p class="empty">Dossier vidéos non configuré (TIKTOK_VIDEO_DIR).</p>';
    return;
  }
  vidEl.innerHTML = data.videos.length ? '' : '<p class="empty">Aucune vidéo rendue disponible.</p>';
  for (const v of data.videos) {
    const div = document.createElement('div');
    div.className = 'row';
    const opts = data.accounts.map((a) => `<option value="${a.account}">${a.account}</option>`).join('');
    div.innerHTML = `<div class="grow"><div class="name">${v.name}</div><div class="meta">${fmtSize(v.size)}</div></div>
      <select>${opts}</select><button>Publier</button><span class="status"></span>`;
    const [select, btn, status] = [div.querySelector('select'), div.querySelector('button'), div.querySelector('.status')];
    if (!data.accounts.length) btn.disabled = true;
    btn.onclick = () => publish(v.name, select.value, btn, status);
    vidEl.appendChild(div);
  }
}

async function publish(video, account, btn, status) {
  btn.disabled = true;
  status.className = 'status pending';
  status.textContent = 'envoi…';
  try {
    const r = await fetch('/admin/tiktok/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ video, account }),
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || 'échec');
    status.textContent = 'encodage TikTok…';
    // TikTok encode la vidéo après l'upload : on sonde jusqu'au statut final plutôt
    // que d'annoncer un succès non vérifié. L'encodage prend en général une dizaine
    // de secondes mais peut dépasser la minute : on laisse 3 min avant d'abandonner,
    // et on affiche le statut réel pour ne pas laisser croire à un échec.
    const DEADLINE = Date.now() + 3 * 60 * 1000;
    while (Date.now() < DEADLINE) {
      await new Promise((res) => setTimeout(res, 3000));
      const sr = await fetch(`/admin/tiktok/status?account=${encodeURIComponent(account)}&publish_id=${encodeURIComponent(out.publish_id)}`);
      const st = await sr.json();
      if (st.status === 'PUBLISH_COMPLETE') {
        status.className = 'status ok';
        status.textContent = '✓ publié';
        return;
      }
      if (st.status === 'FAILED') throw new Error(st.fail_reason || 'publication refusée');
      const left = Math.max(0, Math.round((DEADLINE - Date.now()) / 1000));
      status.textContent = `${(st.status || '…').toLowerCase().replace(/_/g, ' ')} (${left}s)`;
    }
    status.className = 'status pending';
    status.textContent = 'encodage plus long que prévu — vérifie dans TikTok';
  } catch (e) {
    status.className = 'status err';
    status.textContent = '✗ ' + e.message;
    btn.disabled = false;
  }
}

document.getElementById('connect').onclick = () => {
  const label = document.getElementById('label').value.trim();
  if (!label) return alert('Donne un nom au compte (ex: tomya_agency).');
  location.href = '/admin/tiktok/connect?label=' + encodeURIComponent(label);
};

load();
</script>
</body>
</html>
